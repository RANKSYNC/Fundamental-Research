<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 پیش‌نمایش خبر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container preview-container">
    <header>
        <div class="header-actions">
            <a href="index.html" class="btn-back">← بازگشت به فرم</a>
            <span class="badge-live">● زنده</span>
        </div>
        <h1>📄 پیش‌نمایش خبر</h1>
        <p class="subtitle">خبر تولید شده آماده انتشار در تلگرام</p>
    </header>

    <div class="preview-card" id="previewCard">
        <div id="previewContent">📥 در حال بارگذاری خبر...</div>
    </div>

    <div class="preview-actions">
        <button class="btn-copy" onclick="copyTelegram()">📋 کپی پیام تلگرام</button>
        <button class="btn-copy-json" onclick="copyJSON()">📄 کپی JSON</button>
        <button class="btn-edit" onclick="window.location.href='index.html'">✏️ ویرایش</button>
        <button class="btn-new" onclick="newNews()">➕ خبر جدید</button>
    </div>

    <div class="preview-json">
        <h3>📄 خروجی JSON</h3>
        <pre id="jsonOutput">// در حال بارگذاری...</pre>
    </div>
</div>

<script>
// ============================================================
// ===== داده‌های کامل =====
// ============================================================

var assetNames = {
    BTC: 'Bitcoin',
    ALT: 'Altcoin',
    MEME: 'Meme Coin',
    USD: 'USD',
    EUR: 'EUR',
    GBP: 'GBP',
    JPY: 'JPY',
    CNY: 'CNY',
    RUB: 'RUB',
    GOLD: 'Gold',
    SILVER: 'Silver',
    OIL: 'Oil',
    NATURAL_GAS: 'Natural Gas',
    SP500: 'S&P 500',
    NASDAQ: 'NASDAQ',
    DOW: 'Dow Jones',
    OTHER: 'Other'
};

var assetIcons = {
    BTC: '₿',
    ALT: '🪙',
    MEME: '🐶',
    USD: '💵',
    EUR: '💶',
    GBP: '💷',
    JPY: '💴',
    CNY: '💰',
    RUB: '₽',
    GOLD: '🥇',
    SILVER: '🥈',
    OIL: '🛢️',
    NATURAL_GAS: '🔥',
    SP500: '📈',
    NASDAQ: '📊',
    DOW: '📉',
    OTHER: '🔹'
};

var categoryMap = {
    geopolitical: '🌍 Geopolitical',
    central_bank: '🏛️ Central Bank',
    interest_rate: '💰 Interest Rate',
    inflation: '📈 Inflation',
    employment: '👔 Employment',
    economic_growth: '📊 Economic Growth',
    liquidity: '💧 Liquidity',
    regulation: '⚖️ Regulation',
    blockchain: '⛓️ Blockchain',
    onchain: '📡 On-Chain',
    sentiment: '😊 Sentiment',
    retail: '👥 Retail',
    sanctions: '🚫 Sanctions',
    macroeconomics: '🌐 Macroeconomics',
    other: '🔹 Other'
};

// ============================================================
// ===== توابع =====
// ============================================================

function $(id) { return document.getElementById(id); }

function showToast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() {
        t.classList.add('hide');
        setTimeout(function() { t.remove(); }, 300);
    }, 3000);
}

// ============================================================
// ===== ساخت پیام تلگرام (نسخه مینیمال و شیک) =====
// ============================================================

function generateTelegramMessage(obj) {
    // تاثیر
    var impactText = '';
    if (obj.impact && Object.keys(obj.impact).length > 0) {
        var count = 0;
        for (var key in obj.impact) {
            var val = obj.impact[key];
            var name = assetNames[key] || key;
            var emoji = val === 'positive' ? '🟢' : val === 'negative' ? '🔴' : '⚪';
            var label = val === 'positive' ? 'Bullish' : val === 'negative' ? 'Bearish' : 'Neutral';
            impactText += emoji + ' ' + name + ' → ' + label;
            count++;
            if (count < Object.keys(obj.impact).length) {
                impactText += '\n';
            }
        }
    } else {
        impactText = '⚪ No Impact';
    }

    // ایموجی کشور برای عنوان
    var countryEmojis = {
        'روسیه': '🇷🇺',
        'آمریکا': '🇺🇸',
        'چین': '🇨🇳',
        'ژاپن': '🇯🇵',
        'انگلیس': '🇬🇧',
        'اروپا': '🇪🇺',
        'کانادا': '🇨🇦',
        'استرالیا': '🇦🇺',
        'ایران': '🇮🇷',
        'ترکیه': '🇹🇷',
        'آلمان': '🇩🇪',
        'فرانسه': '🇫🇷',
        'ایتالیا': '🇮🇹',
        'اسپانیا': '🇪🇸',
        'برزیل': '🇧🇷',
        'هند': '🇮🇳',
        'کره': '🇰🇷',
        'امارات': '🇦🇪',
        'عربستان': '🇸🇦'
    };
    
    var title = obj.news.title || 'بدون عنوان';
    var titleEmoji = '';
    for (var country in countryEmojis) {
        if (title.includes(country)) {
            titleEmoji = countryEmojis[country] + ' ';
            break;
        }
    }

    // هشتگ‌ها
    var tags = '';
    if (obj.assets && obj.assets.length > 0) {
        tags = obj.assets.map(function(a) { return '#' + a; }).join(' ');
    }

    // زمان
    var timeStr = (obj.time.date || '') + ' | ' + (obj.time.time || '');

    // ===== ساخت پیام =====
    var msg = '';
    msg += '🟢 FUNDAMENTAL NEWS\n';
    msg += '\n';
    msg += titleEmoji + title + '\n';
    msg += '\n';
    msg += (obj.news.content || 'متن خبری وجود ندارد') + '\n';
    msg += '\n';
    msg += '━━━━━━━━━━━━\n';
    msg += '📈 Impact\n';
    msg += impactText + '\n';
    msg += '\n';
    msg += '🕒 ' + timeStr + '\n';
    if (obj.news.source) {
        msg += '🔗 ' + obj.news.source + '\n';
    }
    if (tags) {
        msg += tags;
    }

    return msg;
}

// ============================================================
// ===== کپی پیام تلگرام =====
// ============================================================

function copyTelegram() {
    if (!window._lastTelegram) {
        showToast('⚠️ خبری برای کپی وجود ندارد!');
        return;
    }
    
    var cleanText = window._lastTelegram.replace(/\*/g, '');
    
    navigator.clipboard.writeText(cleanText).then(function() {
        showToast('✅ پیام تلگرام کپی شد!');
    }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = cleanText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ پیام تلگرام کپی شد!');
    });
}

// ============================================================
// ===== کپی JSON =====
// ============================================================

function copyJSON() {
    if (!window._lastNews) {
        showToast('⚠️ خبری برای کپی وجود ندارد!');
        return;
    }
    var json = JSON.stringify(window._lastNews, null, 2);
    navigator.clipboard.writeText(json).then(function() {
        showToast('✅ JSON کپی شد!');
    }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = json;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ JSON کپی شد!');
    });
}

function newNews() {
    sessionStorage.removeItem('preview_news');
    localStorage.removeItem('last_news');
    window.location.href = 'index.html';
}

// ============================================================
// ===== نمایش خبر =====
// ============================================================

function displayPreview(obj) {
    var container = $('previewContent');
    var jsonOutput = $('jsonOutput');

    console.log('📊 نمایش خبر:', obj);

    if (!obj) {
        container.innerHTML = '<p style="color:#a0aec0; text-align:center; padding:40px;">📭 هیچ خبری برای نمایش وجود ندارد</p>';
        jsonOutput.textContent = '// هیچ داده‌ای وجود ندارد';
        return;
    }

    var impactHTML = '';
    if (obj.impact && Object.keys(obj.impact).length > 0) {
        for (var key in obj.impact) {
            var val = obj.impact[key];
            var name = assetNames[key] || key;
            var emoji = val === 'positive' ? '🟢' : val === 'negative' ? '🔴' : '⚪';
            var label = val === 'positive' ? 'Bullish 📈' : val === 'negative' ? 'Bearish 📉' : 'Neutral ⏸️';
            var cls = val === 'positive' ? 'impact-positive' : val === 'negative' ? 'impact-negative' : 'impact-neutral';
            impactHTML +=
                '<div class="impact-item-preview">' +
                '<span>' + emoji + '</span>' +
                '<span>' + (assetIcons[key] || '📌') + ' ' + name + '</span>' +
                '<span class="' + cls + '">' + label + '</span>' +
                '</div>';
        }
    } else {
        impactHTML = '<p style="color:#a0aec0; grid-column:1/-1; text-align:center;">No Impact</p>';
    }

    var mainCat = categoryMap[obj.category.main] || obj.category.main || 'Unknown';
    var subCat = obj.category.sub ? ' › ' + obj.category.sub : '';

    var tags = '';
    if (obj.assets && obj.assets.length > 0) {
        tags = obj.assets.map(function(a) {
            return '<span class="asset-tag">' + (assetIcons[a] || '📌') + ' ' + (assetNames[a] || a) + '</span>';
        }).join('');
    }

    var timeParts = [];
    if (obj.time.shortTerm) timeParts.push('⏱️ Short: ' + obj.time.shortTerm);
    if (obj.time.mediumTerm) timeParts.push('Mid: ' + obj.time.mediumTerm);
    if (obj.time.longTerm) timeParts.push('Long: ' + obj.time.longTerm);

    container.innerHTML =
        '<div class="news-title">📌 ' + (obj.news.title || 'بدون عنوان') + '</div>' +
        '<div class="news-meta">' +
        '<span class="meta-tag">' + mainCat + subCat + '</span>' +
        '<span>📅 ' + (obj.time.date || 'نامشخص') + '  ⏰ ' + (obj.time.time || '') + '</span>' +
        (timeParts.length > 0 ? '<span>📊 ' + timeParts.join('  |  ') + '</span>' : '') +
        (obj.news.source ? '<span>🔗 ' + obj.news.source + '</span>' : '') +
        '<span>🆔 ' + obj.id + '</span>' +
        '</div>' +
        '<div class="news-content-text">' + (obj.news.content || 'متن خبری وجود ندارد') + '</div>' +
        '<div class="impact-section-title">📊 Impact</div>' +
        '<div class="impact-grid">' + impactHTML + '</div>' +
        '<div class="asset-tags">' + tags + '</div>';

    jsonOutput.textContent = JSON.stringify(obj, null, 2);

    window._lastNews = obj;
    window._lastTelegram = generateTelegramMessage(obj);
}

// ============================================================
// ===== بارگذاری =====
// ============================================================

var data = sessionStorage.getItem('preview_news') || localStorage.getItem('last_news');

console.log('📥 داده دریافت شد:', data);

if (data) {
    try {
        var obj = JSON.parse(data);
        displayPreview(obj);
    } catch (e) {
        console.error('❌ خطا در پارس داده:', e);
        $('previewContent').innerHTML = '<p style="color:#a0aec0;">❌ خطا در بارگذاری خبر</p>';
        $('jsonOutput').textContent = '// خطا در بارگذاری';
    }
} else {
    $('previewContent').innerHTML = '<p style="color:#a0aec0; text-align:center; padding:40px;">📭 هیچ خبری برای نمایش وجود ندارد</p>';
    $('jsonOutput').textContent = '// هیچ داده‌ای وجود ندارد';
}

console.log('✅ صفحه پیش‌نمایش آماده است!');
</script>

</body>
</html>
