<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 پیش‌نمایش خبر فاندامنتال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container preview-container">
        <header>
            <div class="header-actions">
                <a href="index.html" class="btn-back">
                    <span>←</span> بازگشت به فرم
                </a>
                <span class="badge-live">
                    <span>●</span> زنده
                </span>
            </div>
            <h1>📄 پیش‌نمایش خبر</h1>
            <p class="subtitle">خبر تولید شده آماده انتشار در تلگرام</p>
        </header>

        <!-- کارت پیش‌نمایش -->
        <div class="preview-card" id="previewCard">
            <!-- محتوای خبر توسط JavaScript پر می‌شود -->
        </div>

        <!-- دکمه‌های اقدام -->
        <div class="preview-actions">
            <button class="btn-copy" onclick="copyTelegram()">
                <span>📋</span> کپی پیام تلگرام
            </button>
            <button class="btn-copy-json" onclick="copyJSON()">
                <span>📄</span> کپی JSON
            </button>
            <button class="btn-edit" onclick="editNews()">
                <span>✏️</span> ویرایش خبر
            </button>
            <button class="btn-new" onclick="newNews()">
                <span>➕</span> خبر جدید
            </button>
        </div>

        <!-- خروجی JSON -->
        <div class="preview-json" id="previewJSON">
            <div class="preview-json-header">
                <h3>
                    <span>📄</span> خروجی JSON
                </h3>
                <button class="btn-copy-json-mini" onclick="copyJSON()">
                    📋 کپی JSON
                </button>
            </div>
            <pre id="jsonOutput">// در حال بارگذاری...</pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
