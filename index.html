<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 سیستم ثبت خبر فاندامنتال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 ثبت خبر فاندامنتال</h1>
            <p class="subtitle">سیستم ثبت و مدیریت اخبار اقتصادی - <span id="liveTime">⏰</span></p>
        </header>

        <form id="newsForm">
            <!-- بخش 1: دارایی مربوطه -->
            <div class="form-section">
                <div class="section-header">
                    <span class="section-number">1</span>
                    <h2>دارایی مربوطه</h2>
                    <span class="required-badge">الزامی</span>
                </div>
                <div class="asset-grid" id="assetGrid">
                    <label class="asset-item" data-asset="BTC">
                        <input type="checkbox" value="BTC" name="asset">
                        <span class="asset-icon">₿</span>
                        <span class="asset-name">Bitcoin</span>
                        <span class="asset-symbol">BTC</span>
                    </label>
                    <label class="asset-item" data-asset="ETH">
                        <input type="checkbox" value="ETH" name="asset">
                        <span class="asset-icon">⟠</span>
                        <span class="asset-name">Ethereum</span>
                        <span class="asset-symbol">ETH</span>
                    </label>
                    <label class="asset-item" data-asset="ALT">
                        <input type="checkbox" value="ALT" name="asset">
                        <span class="asset-icon">🪙</span>
                        <span class="asset-name">Altcoin</span>
                        <span class="asset-symbol">ALT</span>
                    </label>
                    <label class="asset-item" data-asset="MEME">
                        <input type="checkbox" value="MEME" name="asset">
                        <span class="asset-icon">🐶</span>
                        <span class="asset-name">Meme Coin</span>
                        <span class="asset-symbol">MEME</span>
                    </label>
                    <label class="asset-item" data-asset="USD">
                        <input type="checkbox" value="USD" name="asset">
                        <span class="asset-icon">💵</span>
                        <span class="asset-name">USD</span>
                        <span class="asset-symbol">USD</span>
                    </label>
                    <label class="asset-item" data-asset="EUR">
                        <input type="checkbox" value="EUR" name="asset">
                        <span class="asset-icon">💶</span>
                        <span class="asset-name">EUR</span>
                        <span class="asset-symbol">EUR</span>
                    </label>
                    <label class="asset-item" data-asset="GBP">
                        <input type="checkbox" value="GBP" name="asset">
                        <span class="asset-icon">💷</span>
                        <span class="asset-name">GBP</span>
                        <span class="asset-symbol">GBP</span>
                    </label>
                    <label class="asset-item" data-asset="GOLD">
                        <input type="checkbox" value="GOLD" name="asset">
                        <span class="asset-icon">🥇</span>
                        <span class="asset-name">Gold</span>
                        <span class="asset-symbol">XAU</span>
                    </label>
                    <label class="asset-item" data-asset="OIL">
                        <input type="checkbox" value="OIL" name="asset">
                        <span class="asset-icon">🛢️</span>
                        <span class="asset-name">Oil</span>
                        <span class="asset-symbol">WTI</span>
                    </label>
                    <label class="asset-item" data-asset="STOCK">
                        <input type="checkbox" value="STOCK" name="asset">
                        <span class="asset-icon">📈</span>
                        <span class="asset-name">Stock Market</span>
                        <span class="asset-symbol">SPX</span>
                    </label>
                    <label class="asset-item" data-asset="OTHER">
                        <input type="checkbox" value="OTHER" name="asset">
                        <span class="asset-icon">🔹</span>
                        <span class="asset-name">Other</span>
                        <span class="asset-symbol">---</span>
                    </label>
                </div>
                <div class="selected-assets" id="selectedAssets">
                    <span class="hint">هنوز دارایی‌ای انتخاب نشده</span>
                </div>
            </div>

            <!-- بخش 2: دسته‌بندی -->
            <div class="form-section">
                <div class="section-header">
                    <span class="section-number">2</span>
                    <h2>دسته‌بندی فاندامنتال</h2>
                    <span class="required-badge">الزامی</span>
                </div>
                <div class="category-group">
                    <select id="mainCategory" required>
                        <option value="">📂 انتخاب دسته اصلی...</option>
                        <option value="geopolitical">🌍 ژئوپلیتیک</option>
                        <option value="central_bank">🏛️ بانک مرکزی</option>
                        <option value="interest_rate">💰 نرخ بهره</option>
                        <option value="inflation">📈 تورم</option>
                        <option value="employment">👔 اشتغال</option>
                        <option value="economic_growth">📊 رشد اقتصادی</option>
                        <option value="liquidity">💧 نقدینگی</option>
                        <option value="regulation">⚖️ مقررات</option>
                        <option value="sentiment">😊 احساسات بازار</option>
                        <option value="other">🔹 سایر</option>
                    </select>
                    
                    <div class="sub-category" id="subCategoryContainer">
                        <select id="subCategory" disabled>
                            <option value="">ابتدا دسته اصلی را انتخاب کنید</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- بخش 3: محتوای خبر -->
            <div class="form-section">
                <div class="section-header">
                    <span class="section-number">3</span>
                    <h2>محتوای خبر</h2>
                    <span class="required-badge">الزامی</span>
                </div>
                <div class="news-content">
                    <div class="form-group">
                        <label for="newsTitle">عنوان خبر</label>
                        <input type="text" id="newsTitle" placeholder="مثال: فدرال رزرو نرخ بهره را افزایش داد" required>
                    </div>
                    <div class="form-group">
                        <label for="newsContent">متن خبر</label>
                        <textarea id="newsContent" placeholder="متن کامل خبر را وارد کنید..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="newsSource">منبع خبر <span class="optional">(اختیاری)</span></label>
                        <input type="text" id="newsSource" placeholder="مثال: Reuters, Bloomberg, ...">
                    </div>
                </div>
            </div>

            <!-- بخش 4: تاثیر روی دارایی‌ها -->
            <div class="form-section">
                <div class="section-header">
                    <span class="section-number">4</span>
                    <h2>تاثیر روی دارایی‌ها</h2>
                    <span class="optional-badge">اختیاری</span>
                </div>
                <div class="impact-section" id="impactSection">
                    <p class="impact-hint">💡 برای هر دارایی، یکی از گزینه‌های زیر را انتخاب کنید</p>
                    <div id="impactContainer">
                        <!-- دکمه‌های تاثیر به صورت داینامیک ساخته می‌شوند -->
                    </div>
                </div>
            </div>

            <!-- بخش 5: زمان -->
            <div class="form-section">
                <div class="section-header">
                    <span class="section-number">5</span>
                    <h2>زمان</h2>
                    <span class="optional-badge">اختیاری</span>
                </div>
                <div class="time-group">
                    <div class="time-row">
                        <div class="form-group">
                            <label for="newsDate">تاریخ</label>
                            <input type="date" id="newsDate">
                        </div>
                        <div class="form-group">
                            <label for="newsTime">زمان</label>
                            <input type="time" id="newsTime">
                        </div>
                    </div>
                    <div class="time-row">
                        <div class="form-group">
                            <label for="shortTerm">کوتاه‌مدت</label>
                            <select id="shortTerm">
                                <option value="">انتخاب...</option>
                                <option value="hours">ساعت‌ها (Hours)</option>
                                <option value="days">روزها (Days)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mediumTerm">میان‌مدت</label>
                            <select id="mediumTerm">
                                <option value="">انتخاب...</option>
                                <option value="weeks">هفته‌ها (Weeks)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="longTerm">بلندمدت</label>
                            <select id="longTerm">
                                <option value="">انتخاب...</option>
                                <option value="months">ماه‌ها (Months)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- دکمه ثبت -->
            <button type="submit" class="btn-submit">
                <span class="btn-icon">✨</span>
                تولید خبر
                <span class="btn-subtitle">ساخت و نمایش خبر نهایی</span>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
