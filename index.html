<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت خبر فاندامنتال</title>
    <style>
        /* استایل‌های کامل در style.css */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-right: 10px;
        }
        
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
        }
        
        .asset-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .asset-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .asset-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .category-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
        }
        
        .category-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            background: white;
        }
        
        .category-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .sub-category {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        
        .sub-category select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        
        input[type="text"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .impact-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }
        
        .impact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: white;
            margin-bottom: 8px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
        }
        
        .impact-item .asset-name {
            font-weight: 600;
            color: #333;
            min-width: 80px;
        }
        
        .impact-buttons {
            display: flex;
            gap: 10px;
        }
        
        .impact-btn {
            padding: 6px 16px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .impact-btn.positive {
            color: #28a745;
            border-color: #28a745;
        }
        
        .impact-btn.positive.active {
            background: #28a745;
            color: white;
        }
        
        .impact-btn.negative {
            color: #dc3545;
            border-color: #dc3545;
        }
        
        .impact-btn.negative.active {
            background: #dc3545;
            color: white;
        }
        
        .impact-btn.neutral {
            color: #6c757d;
            border-color: #6c757d;
        }
        
        .impact-btn.neutral.active {
            background: #6c757d;
            color: white;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .output-section {
            margin-top: 30px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        
        .output-section.show {
            display: block;
        }
        
        .output-section h3 {
            color: #fff;
            margin-bottom: 10px;
        }
        
        .output-section pre {
            color: #0f0;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 0.9em;
        }
        
        .btn-copy {
            margin-top: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-copy:hover {
            background: #218838;
        }
        
        .telegram-preview {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-right: 4px solid #0088cc;
        }
        
        .telegram-preview h4 {
            color: #0088cc;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .asset-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 ثبت خبر فاندامنتال</h1>
        <p class="subtitle">سیستم ثبت و مدیریت اخبار اقتصادی</p>
        
        <form id="newsForm">
            <!-- 1. Asset -->
            <div class="form-group">
                <label>دارایی مربوطه <span class="tag">مهم</span></label>
                <div class="asset-grid" id="assetGrid">
                    <label class="asset-item">
                        <input type="checkbox" value="BTC" name="asset"> Bitcoin (BTC)
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="ETH" name="asset"> Ethereum (ETH)
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="ALT" name="asset"> Altcoin
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="MEME" name="asset"> Meme Coin
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="USD" name="asset"> USD
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="EUR" name="asset"> EUR
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="GBP" name="asset"> GBP
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="GOLD" name="asset"> Gold
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="OIL" name="asset"> Oil
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="STOCK" name="asset"> Stock Market
                    </label>
                    <label class="asset-item">
                        <input type="checkbox" value="OTHER" name="asset"> Other
                    </label>
                </div>
            </div>
            
            <!-- 2. Category -->
            <div class="form-group">
                <label>دسته‌بندی فاندامنتال <span class="tag">مهم</span></label>
                <div class="category-group">
                    <select id="mainCategory" required>
                        <option value="">انتخاب دسته اصلی...</option>
                        <option value="geopolitical">🌍 Geopolitical</option>
                        <option value="central_bank">🏛️ Central Bank</option>
                        <option value="interest_rate">💰 Interest Rate</option>
                        <option value="inflation">📈 Inflation</option>
                        <option value="employment">👔 Employment</option>
                        <option value="economic_growth">📊 Economic Growth</option>
                        <option value="liquidity">💧 Liquidity</option>
                        <option value="regulation">⚖️ Regulation</option>
                        <option value="sentiment">😊 Market Sentiment</option>
                        <option value="other">🔹 Other</option>
                    </select>
                    
                    <div class="sub-category" id="subCategoryContainer">
                        <select id="subCategory">
                            <option value="">انتخاب زیردسته...</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- 3. News Content -->
            <div class="form-group">
                <label>خبر <span class="tag">مهم</span></label>
                <input type="text" id="newsTitle" placeholder="عنوان خبر..." required>
                <br><br>
                <textarea id="newsContent" placeholder="متن خبر..." required></textarea>
                <br><br>
                <input type="text" id="newsSource" placeholder="منبع خبر...">
            </div>
            
            <!-- 4. Impact -->
            <div class="form-group">
                <label>تاثیر روی دارایی‌ها <span class="tag">مهم</span></label>
                <div class="impact-section" id="impactSection">
                    <div class="impact-item">
                        <span class="asset-name">BTC</span>
                        <div class="impact-buttons">
                            <button type="button" class="impact-btn positive" data-asset="BTC" data-value="positive">↑</button>
                            <button type="button" class="impact-btn negative" data-asset="BTC" data-value="negative">↓</button>
                            <button type="button" class="impact-btn neutral" data-asset="BTC" data-value="neutral">→</button>
                        </div>
                    </div>
                    <div class="impact-item">
                        <span class="asset-name">USD</span>
                        <div class="impact-buttons">
                            <button type="button" class="impact-btn positive" data-asset="USD" data-value="positive">↑</button>
                            <button type="button" class="impact-btn negative" data-asset="USD" data-value="negative">↓</button>
                            <button type="button" class="impact-btn neutral" data-asset="USD" data-value="neutral">→</button>
                        </div>
                    </div>
                    <div class="impact-item">
                        <span class="asset-name">Gold</span>
                        <div class="impact-buttons">
                            <button type="button" class="impact-btn positive" data-asset="Gold" data-value="positive">↑</button>
                            <button type="button" class="impact-btn negative" data-asset="Gold" data-value="negative">↓</button>
                            <button type="button" class="impact-btn neutral" data-asset="Gold" data-value="neutral">→</button>
                        </div>
                    </div>
                    <div class="impact-item">
                        <span class="asset-name">EUR</span>
                        <div class="impact-buttons">
                            <button type="button" class="impact-btn positive" data-asset="EUR" data-value="positive">↑</button>
                            <button type="button" class="impact-btn negative" data-asset="EUR" data-value="negative">↓</button>
                            <button type="button" class="impact-btn neutral" data-asset="EUR" data-value="neutral">→</button>
                        </div>
                    </div>
                    <div class="impact-item">
                        <span class="asset-name">Oil</span>
                        <div class="impact-buttons">
                            <button type="button" class="impact-btn positive" data-asset="Oil" data-value="positive">↑</button>
                            <button type="button" class="impact-btn negative" data-asset="Oil" data-value="negative">↓</button>
                            <button type="button" class="impact-btn neutral" data-asset="Oil" data-value="neutral">→</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 5. Time -->
            <div class="form-group">
                <label>زمان</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-weight: normal; font-size: 0.9em;">تاریخ</label>
                        <input type="date" id="newsDate">
                    </div>
                    <div>
                        <label style="font-weight: normal; font-size: 0.9em;">زمان</label>
                        <input type="time" id="newsTime">
                    </div>
                </div>
                <br>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-weight: normal; font-size: 0.9em;">کوتاه‌مدت</label>
                        <select id="shortTerm" style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #ddd;">
                            <option value="">انتخاب...</option>
                            <option value="hours">Hours</option>
                            <option value="days">Days</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: normal; font-size: 0.9em;">میان‌مدت</label>
                        <select id="mediumTerm" style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #ddd;">
                            <option value="">انتخاب...</option>
                            <option value="weeks">Weeks</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: normal; font-size: 0.9em;">بلندمدت</label>
                        <select id="longTerm" style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #ddd;">
                            <option value="">انتخاب...</option>
                            <option value="months">Months</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">📝 ثبت خبر</button>
        </form>
        
        <!-- Output -->
        <div class="output-section" id="outputSection">
            <h3>📄 خروجی JSON</h3>
            <pre id="jsonOutput"></pre>
            
            <h3 style="color: #fff; margin-top: 20px;">📱 پیش‌نمایش پیام تلگرام</h3>
            <div class="telegram-preview" id="telegramPreview"></div>
            
            <button class="btn-copy" onclick="copyToClipboard()">📋 کپی JSON</button>
            <button class="btn-copy" style="background: #0088cc; margin-right: 10px;" onclick="copyTelegram()">📋 کپی پیام تلگرام</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
